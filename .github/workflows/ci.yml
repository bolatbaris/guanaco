name: ci

env:
  DO_NOT_TRACK: 1

on:
  pull_request:
    branches:
      - main
      - production
  merge_group:
  push:
    branches:
      - production

concurrency:
  # Production pushes use a unique run_id; PRs share a group to auto-cancel old runs.
  group: ${{ github.ref == 'refs/heads/production' &&
    format('{0}-{1}', github.workflow, github.run_id) ||
    format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/test.yml
    secrets: inherit
